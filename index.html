<style>
:root{--pink:#e86a9b;--pinkdark:#ad4f79;--rose:#fce0eb;--blush:#fff3f8;--ink:#533b4b;--muted:#997d8d;--card:#fff;--line:#f6dfe9;--shadow:0 7px 30px #9e64801b;color-scheme:light}*{box-sizing:border-box}html{background:#fff1f6}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;background:linear-gradient(150deg,#fff6fa,#fff0f6 60%,#fdf9ff);color:var(--ink);min-height:100dvh}button,input,select,textarea{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #eaa1c3;outline-offset:2px}.app{max-width:540px;min-height:100dvh;margin:auto;padding:18px 16px calc(105px + env(safe-area-inset-bottom));position:relative}.top{display:flex;align-items:center;justify-content:space-between;margin:0 0 18px}.brand{font-size:40px;line-height:1;color:var(--pink);font-family:Georgia,serif;letter-spacing:-3px;font-style:italic}.brand small{font-size:24px;letter-spacing:0}.topright{font-size:12px;color:var(--muted);background:white;border-radius:30px;padding:9px 12px;border:1px solid var(--line)}h1,h2,h3,p{margin-top:0}h1{font-size:22px}h2{font-size:19px;margin-bottom:12px}h3{font-size:15px;margin-bottom:7px}p{line-height:1.65}.small{font-size:12px;color:var(--muted)}.muted{color:var(--muted)}.hero{background:linear-gradient(120deg,#ffdaea,#fff2f7 75%);min-height:180px;border-radius:25px;padding:20px;position:relative;overflow:hidden;margin-bottom:16px;box-shadow:var(--shadow)}.hero .intro{max-width:59%;position:relative;z-index:2}.hero .eyebrow{font-size:11px;font-weight:750;color:var(--pinkdark);letter-spacing:2px}.hero h1{font-size:22px;line-height:1.4;margin:10px 0}.hero p{font-size:12px;margin:0;color:#925b76}.hero:after{content:'✦';position:absolute;right:22px;top:14px;color:#fff;font-size:24px}.girl{width:181px;height:195px;position:absolute;right:-8px;bottom:-15px;object-fit:contain;object-position:center bottom;filter:drop-shadow(0 5px eld label{display:block;font-size:12px;color:var(--pinkdark);font-weight:750;margin-bottom:6px}.field input,.field select,.field textarea,.field .fake{width:100%;background:#fffcfe;border:1px solid #f2ccdc;border-radius:12px;padding:11px;color:var(--ink);min-height:43px}.field textarea{min-height:82px;resize:vertical}.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{padding:9px 12px;border-radius:25px;background:white;border:1px solid #efd3df;color:#8e6580;font-size:12px}.chip.selected{background:#fbe1ec;color:#ad4776;border-color:#ef93b9;font-weight:700}.pill{display:inline-block;font-size:11px;color:#b45e84;background:#ffedf4;border-radius:20px;padding:5px 10px}.list{display:grid;gap:9px}.item{padding:12px 14px}.itemtitle{font-weight:750;font-size:14px}.itemphoto{width:73px;height:73px;border-radius:13px;object-fit:cover}.empty{text-align:center;padding:23px 14px;color:var(--muted);font-size:13px;line-height:1.8}.headrow{display:flex;align-items:center;justify-content:space-between;gap:9px;margin-bottom:12px}.datecontrol{display:flex;gap:6px;align-items:center}.datecontrol button{border:1px solid var(--line);background:white;border-radius:10px;padding:7px 11px;color:var(--pinkdark)}.floatbar{display:flex;gap:8px;position:sticky;top:8px;z-index:5;background:#fff9fce8;padding:8px 0;backdrop-filter:blur(8px)}.floatbar button{flex:1}.foodgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.foodcard{padding:13px;display:grid;gap:6px}.foodemoji{font-size:27px}.foodcard strong{font-size:14px}.foodcard p{font-size:11px;color:var(--muted);margin:0}.meter{height:10px;background:#f6edf2;border-radius:15px;overflow:hidden;margin-top:5px}.meter span{height:100%;display:block;background:linear-gradient(90deg,#f5a9c8,#e776aa);border-radius:15px}.nutritionbox{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.nutrient{background:#fff8fb;border:1px solid var(--line);border-radius:14px;padding:13px}.nutrient .number{font-size:20px;font-weight:800;color:var(--pinkdark)}.nutrient .unit{font-size:11px;color:var(--muted)}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.calday{text-align:center;font-size:12px;color:#9a7d8d;padding:8px 1px}.calcell{aspect-ratio:1;border-radius:12px;min-width:0;background:white;border:1px solid var(--line);position:relative;color:#674f60}.calcell.today{outline:2px solid #f1aec9}.calcell.selected{background:#f9d9e7}.calcell.dot:after{content:'•';position:absolute;color:var(--pink);bottom:0;left:45%;font-size:16px}.tip{background:#fff0f6;color:#945a74;border-left:3px solid #ed9cbd;border-radius:10px;padding:12px;font-size:12px;line-height:1.7}.notice{font-size:11px;line-height:1.65;color:#9b7186}.modalBackdrop{position:fixed;inset:0;background:#2f183b7a;z-index:99;display:flex;align-items:end;justify-content:center}.modal{background:#fff9fc;width:min(540px,100%);max-height:91dvh;overflow:auto;border-radius:23px 23px 0 0;padding:20px 17px calc(22px + env(safe-area-inset-bottom))}.picturePreview{width:100%;max-height:240px;object-fit:contain;border-radius:14px;background:#fff}.hidden{display:none!important}.linkbtn{border:0;background:none;color:var(--pinkdark);text-decoration:underline}.tag{font-size:11px;border-radius:8px;background:#fff0f7;color:#9d5776;padding:4px 7px}.divider{height:1px;background:var(--line);margin:13px 0}.tiny{font-size:10px}.toast{position:fixed;z-index:110;bottom:92px;left:50%;transform:translateX(-50%);background:#68475c;color:white;border-radius:12px;padding:10px 17px;font-size:12px;box-shadow:var(--shadow);max-width:90%;text-align:center}.iconline{font-size:22px}@media(min-width:650px){.app{box-shadow:0 0 40px #a8698230;background:#fff7fb}}@media(prefers-reduced-motion:no-preference){.tile:active,.primary:active{transform:scale(.98)}}
</style></head><body><div id="root" class="app"></div><nav id="nav" class="navi" aria-label="メインメニュー"></nav><div id="modalhost"></div><div id="toast" class="toast hidden"></div>
<script>
'use strict';
const KEY='mimi-v1';const today=()=>new Date().toLocaleDateString('sv-SE');let state={profile:{age:'',height:'',weight:'',activity:'normal',allergies:''},entries:[],onboarded:false};let screen='home',date=today(),nutrient='protein',foodSearch='',foodCategory='all',month=new Date().toISOString().slice(0,7),editId=null,pendingPhoto=null;const foods=[
{name:'卵',emoji:'🥚',group:'protein',desc:'たんぱく質などを含む。朝食にも便利',tags:['protein','fat','iron']},{name:'鶏むね肉',emoji:'🍗',group:'protein',desc:'主菜に取り入れやすい',tags:['protein']},{name:'納豆',emoji:'🫘',group:'protein',desc:'たんぱく質・食物繊維・鉄など',tags:['protein','fiber','iron']},{name:'ヨーグルト',emoji:'🥣',group:'protein',desc:'種類によってカルシウムやたんぱく質を含む',tags:['protein','calcium']},{name:'鮭',emoji:'🐟',group:'protein',desc:'たんぱく質と脂質を含む',tags:['protein','fat']},{name:'豆腐',emoji:'⬜',group:'protein',desc:'たんぱく質を摂れる大豆食品',tags:['protein','calcium']},{name:'牛乳',emoji:'🥛',group:'dairy',desc:'カルシウムを含む',tags:['calcium','protein']},{name:'チーズ',emoji:'🧀',group:'dairy',desc:'カルシウムとたんぱく質',tags:['calcium','protein','fat']},{name:'ごはん',emoji:'🍚',group:'staple',desc:'毎日のエネルギーになる主食',tags:['carb']},{name:'食パン',emoji:'🍞',group:'staple',desc:'卵や乳製品と組み合わせやすい',tags:['carb']},{name:'オートミール',emoji:'🌾',group:'staple',desc:'炭水化物と食物繊維を含む',tags:['carb','fiber']},{name:'さつまいも',emoji:'🍠',group:'staple',desc:'食物繊維も含む',tags:['carb','fiber']},{name:'りんご',emoji:'🍎',group:'fruit',desc:'果物として食物繊維などを摂れる',tags:['carb','fiber']},{name:'みかん',emoji:'🍊',group:'fruit',desc:'ビタミンCを含む果物',tags:['carb','vitamin']},{name:'小松菜',emoji:'🥬',group:'veg',desc:'カルシウムや鉄などを含む',tags:['calcium','iron','fiber']},{name:'ブロッコリー',emoji:'🥦',group:'veg',desc:'ビタミンCや食物繊維を含む',tags:['fiber','vitamin']},{name:'きのこ',emoji:'🍄',group:'veg',desc:'料理に足しやすい食物繊維',tags:['fiber']},{name:'赤身肉',emoji:'🥩',group:'protein',desc:'鉄やたんぱく質を含む',tags:['iron','protein']},{name:'あさり',emoji:'🐚',group:'protein',desc:'鉄などを含む貝類',tags:['iron','protein']},{name:'アボカド',emoji:'🥑',group:'fruit',desc:'脂質や食物繊維を含む',tags:['fat','fiber']},{name:'くるみ',emoji:'🌰',group:'other',desc:'脂質を含む。ナッツアレルギーに注意',tags:['fat','fiber']},{name:'オリーブオイル',emoji:'🫒',group:'other',desc:'料理に使う油脂のひとつ',tags:['fat']}];
const nutrients={protein:{label:'たんぱく質',icon:'🥚',about:'筋肉・皮膚・髪など、体をつくる材料になるよ。',hint:'卵、魚、肉、豆製品、乳製品など、いろいろな食品を組み合わせよう。'},fat:{label:'脂質',icon:'🥑',about:'細胞やホルモンの材料になり、エネルギーにもなるよ。',hint:'魚、ナッツ、油などにも脂質が含まれるよ。脂質をゼロにする必要はないよ。'},carb:{label:'炭水化物',icon:'🍙',about:'勉強や運動など、体を動かすための大切なエネルギー源。',hint:'ごはん、パン、麺、いもなどの主食を無理に抜かないでね。'},fiber:{label:'食物繊維',icon:'🥦',about:'腸の働きやお通じを支えるよ。',hint:'野菜、果物、豆、きのこ、穀物をいろいろ食べてみよう。'},calcium:{label:'カルシウム',icon:'🥛',about:'骨や歯を育てるために重要な栄養素だよ。',hint:'乳製品、小松菜、豆腐などから摂れるよ。'},iron:{label:'鉄',icon:'🥬',about:'血液のヘモグロビンの材料。特に成長期は大切だよ。',hint:'赤身肉や貝類、大豆製品、青菜などに含まれるよ。'},vitamin:{label:'ビタミン',icon:'🍊',about:'体の調子を整えるさまざまな役割があるよ。',hint:'野菜や果物など、色々な食品を取り入れてみよう。'}};
function h(s){return String(s??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#39;')}function attr(s){return h(s)}function uid(){return crypto.randomUUID?crypto.randomUUID():String(Date.now()+Math.random())}function persist(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){notify('保存容量に達した可能性があるよ。バックアップを確認してね')}}function load(){try{const old=JSON.parse(localStorage.getItem(KEY));if(old&&old.profile&&Array.isArray(old.entries))state={...state,...old}}catch(e){}}function notify(s){const t=document.querySelector('#toast');t.textContent=s;t.classList.remove('hidden');clearTimeout(notify.timer);notify.timer=setTimeout(()=>t.classList.add('hidden'),2800)}function shell(title,sub){return `<div class="headrow"><div><h1 style="margin:0">${title}</h1>${sub?`<span class="small">${sub}</span>`:''}</div></div>`}function girl(){return `<img class="girl" src="character.webp" alt="アッシュブルーのボブヘアでピースする女の子" decoding="async">`}function nav(){const a=[['home','⌂','ホーム'],['food','✎','記録'],['nutrition','♡','栄養'],['calendar','▦','カレンダー'],['profile','♙','設定']];document.querySelector('#nav').innerHTML=a.map(x=>`<button data-nav="${x[0]}" class="${screen===x[0]?'active':''}"><span class="symbol">${x[1]}</span>${x[2]}</button>`).join('')}function goto(x){screen=x;render();scrollTo({top:0,behavior:'instant'})}function entriesDay(d){return state.entries.filter(x=>x.date===d).sort((a,b)=>(b.created||'').localeCompare(a.created||''))}function dayLabel(d){let v=new Date(d+'T12:00:00');return `${v.getMonth()+1}月${v.getDate()}日`}
function home(){let recent=entriesDay(today());return `<div class="hero"><div class="intro"><div class="eyebrow">MY WELLNESS DIARY ♡</div><h1>${state.profile.name?h(state.profile.name):'あなた'}、<br>今日もおつかれさま♡</h1><p>無理せず、自分のペースで。<br>食べることも休むことも大切だよ。</p></div>${girl()}</div><div class="grid">${[['food','🍽','食事記録','写真とメモで残そう'],['nutrition','📖','栄養図鑑','食べ物の栄養を知ろう'],['activity','👟','運動記録','今日の活動を残そう'],['sleep','🌙','睡眠記録','眠りのリズムを確認'],['mood','💗','体調・気分','心と体の調子を記録'],['calendar','🗓','カレンダー','日々の記録を振り返る']].map(x=>`<button class="tile" data-nav="${x[0]}"><span class="ico">${x[1]}</span><strong>${x[2]}</strong><span>${x[3]}</span></button>`).join('')}</div><div class="sectiontitle section"><h2 style="margin:0">今日のノート ♡</h2><span class="pill">${recent.length}件の記録</span></div>${recent.length?`<div class="list">${recent.slice(0,4).map(renderEntry).join('')}</div>`:`<div class="card empty">まだ記録がないよ 🌷<br>気が向いたときに、今日のことを残してみよう。</div>`}<div class="tip section">毎日記録できなくても大丈夫。体調が悪い日は休んでね。数字を減らすことより、健康に過ごすことを大切にしよう♡</div>`}
function renderEntry(e){const icons={meal:'🍽',activity:'👟',sleep:'🌙',mood:'💗'};return `<div class="item row"><span style="font-size:24px">${icons[e.type]||'♡'}</span>${e.photo?`<img class="itemphoto" alt="食事写真" src="${e.photo}">`:''}<div class="grow"><div class="itemtitle">${h(e.title||'記録')}</div><div class="small">${h(e.note||e.details||'')}${e.type==='sleep'&&e.duration?' ・ '+h(e.duration):''}</div></div><button class="ghost" data-edit="${h(e.id)}" aria-label="編集">⋯</button></div>`}
function dateHeader(){return `<div class="headrow"><div><h1 style="margin:0">毎日の記録 ♡</h1><span class="small">できたことを少しずつ</span></div><div class="datecontrol"><button data-shift="-1">‹</button><span class="small" style="white-space:nowrap">${dayLabel(date)}</span><button data-shift="1">›</button></div></div>`}function food(){let es=entriesDay(date).filter(x=>x.type==='meal');return `${dateHeader()}<div class="floatbar"><button class="primary" data-open="meal">＋ 食事を記録</button><button class="secondary" data-nav="nutrition">栄養図鑑</button></div><div class="card"><h3>写真も一緒に残せるよ 📷</h3><p class="small">朝・昼・夜・おやつを記録できるよ。食事量の計量やカロリー入力は不要だよ。</p></div><h2 class="section">この日の食事</h2>${es.length?`<div class="list">${es.map(renderEntry).join('')}</div>`:`<div class="card empty">この日の食事記録はまだないよ。<br>好きなタイミングで残してね♡</div>`}`}
function activity(){let es=entriesDay(date).filter(x=>x.type==='activity');return `${dateHeader()}<div class="floatbar"><button class="primary" data-open="activity">＋ 活動を記録</button></div><div class="card"><h3>いつもの動きも活動だよ 👟</h3><p class="small">通学・お散歩・部活・ストレッチ。休んだ日も大事な記録だよ。</p></div>${es.length?`<div class="list">${es.map(renderEntry).join('')}</div>`:`<div class="card empty">今日動いたことや休んだことを残してみよう。</div>`}`}
function sleep(){let es=entriesDay(date).filter(x=>x.type==='sleep');return `${dateHeader()}<div class="floatbar"><button class="primary" data-open="sleep">＋ 睡眠を記録</button></div><div class="card"><h3>おやすみ日記 🌙</h3><p class="small">寝た時間と起きた時間、眠りの満足度を記録してみよう。寝る時間を競う必要はないよ。</p></div>${es.length?`<div class="list">${es.map(renderEntry).join('')}</div>`:`<div class="card empty">睡眠の記録はまだないよ。</div>`}`}
function mood(){let es=entriesDay(date).filter(x=>x.type==='mood');return `${dateHeader()}<div class="floatbar"><button class="primary" data-open="mood">＋ 体調・気分を記録</button></div><div class="card"><h3>今日はどんな気分？ 💗</h3><p class="small">元気な日も疲れた日も、そのまま記録していいんだよ。</p></div>${es.length?`<div class="list">${es.map(renderEntry).join('')}</div>`:`<div class="card empty">今日の気分を残してみよう。</div>`}`}
function nutrition(){let n=nutrients[nutrient],arr=foods.filter(x=>x.tags.includes(nutrient)&&(!foodSearch||x.name.includes(foodSearch)||x.desc.includes(foodSearch)));return `${shell('栄養図鑑 ♡','食べ物のこと、少しずつ知ろう')}<div class="card"><div class="chips">${Object.entries(nutrients).map(([k,v])=>`<button class="chip ${nutrient===k?'selected':''}" data-nutrient="${k}">${v.icon} ${v.label}</button>`).join('')}</div></div><div class="card"><h2>${n.icon} ${n.label}</h2><p>${n.about}</p><div class="tip">${n.hint}</div></div><div class="field"><label for="foodsearch">食品を探す</label><input id="foodsearch" autocomplete="off" placeholder="例：納豆、卵、りんご" value="${attr(foodSearch)}"></div><div class="foodgrid">${arr.length?arr.map(f=>`<div class="foodcard"><span class="foodemoji">${f.emoji}</span><strong>${f.name}</strong><p>${f.desc}</p><button class="ghost" style="text-align:left;padding:0;font-size:12px" data-foodname="${f.name}">詳しく見る ›</button></div>`).join(''):`<div class="empty">該当する食品が見つからなかったよ。</div>`}</div><div class="card section"><h3>年齢別の栄養ガイド</h3>${profileGuide()}<p class="notice">掲載食品は代表例で、栄養素の含有量ランキングではないよ。食事の栄養量は品種・調理・分量で変わるので、写真だけから数値は算出しないよ。</p></div>`}
function profileGuide(){let age=Number(state.profile.age),ageband=age>=12&&age<=14?'12〜14歳':age>=15&&age<=17?'15〜17歳':null;if(!ageband)return `<p class="small">プロフィールに年齢を登録すると、成長期に必要な栄養の一般的な情報が見られるよ。</p>`;return `<div class="row between"><span class="pill">${ageband}女子・一般的な参考</span></div><p class="small" style="margin-top:9px">たんぱく質の推奨量：<b>55g/日</b><br>脂質：エネルギーの<b>20〜30%</b><br>炭水化物：エネルギーの<b>50〜65%</b></p><p class="notice">厚生労働省「日本人の食事摂取基準（2025年版）」を参考にした集団向けの値。個人の減量目標・摂取上限ではないよ。</p>`}
function calendar(){let [y,m]=month.split('-').map(Number),first=(new Date(y,m-1,1).getDay()),count=new Date(y,m,0).getDate(),marked=new Set(state.entries.map(x=>x.date));return `${shell('カレンダー ♡','毎日じゃなくても、自分のペースで')}<div class="card"><div class="headrow"><button class="secondary" data-month="-1">‹</button><strong>${y}年 ${m}月</strong><button class="secondary" data-month="1">›</button></div><div class="calendar">${['日','月','火','水','木','金','土'].map(x=>`<div class="calday">${x}</div>`).join('')}${Array.from({length:first},()=>'<div></div>').join('')}${Array.from({length:count},(_,i)=>{let d=`${y}-${String(m).padStart(2,'0')}-${String(i+1).padStart(2,'0')}`;return `<button class="calcell ${d===today()?'today':''} ${d===date?'selected':''} ${marked.has(d)?'dot':''}" data-day="${d}">${i+1}</button>`}).join('')}</div></div><div class="sectiontitle section"><h2 style="margin:0">${dayLabel(date)}の記録</h2><span class="pill">${entriesDay(date).length}件</span></div>${entriesDay(date).length?`<div class="list">${entriesDay(date).map(renderEntry).join('')}</div>`:`<div class="card empty">この日は記録がないよ。空白の日があっても大丈夫♡</div>`}<p class="small">睡眠・食事・活動・体調の記録を日付ごとに振り返れるよ。</p>`}
function profile(){let p=state.profile;return `${shell('マイページ ♡','あなたの情報は、この端末の中に')}<div class="card"><h3>からだのプロフィール（すべて任意）</h3><div class="field"><label for="pname">呼び名</label><input id="pname" maxlength="20" value="${attr(p.name||'あなた')}"></div><div class="formgrid"><div class="field"><label for="page">年齢（歳）</label><input id="page" type="number" min="0" max="120" inputmode="numeric" value="${attr(p.age)}"></div><div class="field"><label for="pactivity">普段の活動量</label><select id="pactivity"><option value="low" ${p.activity==='low'?'selected':''}>少なめ</option><option value="normal" ${p.activity==='normal'?'selected':''}>ふつう</option><option value="high" ${p.activity==='high'?'selected':''}>多め</option></select></div><div class="field"><label for="pheight">身長（cm）</label><input id="pheight" type="number" min="0" max="250" step="0.1" inputmode="decimal" value="${attr(p.height)}"></div><div class="field"><label for="pweight">体重（kg）</label><input id="pweight" type="number" min="0" max="350" step="0.1" inputmode="decimal" value="${attr(p.weight)}"></div></div><div class="field"><label for="pallergies">アレルギー・苦手な食べ物（自由記入）</label><textarea id="pallergies" placeholder="例：くるみ、牛乳">${h(p.allergies||'')}</textarea></div><button class="primary" id="saveprofile">プロフィールを保存</button><p class="notice" style="margin-top:12px">身長・体重は減量目標の算出には利用しないよ。入力しなくてもすべての記録機能を使えるよ。</p></div><div class="card"><h3>栄養の参考情報</h3>${profileGuide()}</div><div class="card"><h3>データの管理</h3><p class="small">記録はこのブラウザー内に保存されるよ。端末やブラウザーのデータを消すと失われる場合があるので、必要ならバックアップしてね。</p><div class="row wrap"><button class="secondary" id="backup">バックアップ保存</button><button class="secondary" id="restoreBtn">バックアップ復元</button></div><input type="file" id="restoreFile" accept="application/json,.json" class="hidden"><div class="divider"></div><button class="danger" id="wipe">すべての記録を削除</button></div><div class="card"><h3>アプリについて</h3><p class="small">mimi v0.4 試作版。AI・広告・外部アカウント連携はなし。食事への点数付けやカロリー制限もしないよ。</p><p class="notice">健康管理の教育・記録用で、診断や個別の減量指導は行わないよ。食事への強い不安、極端な制限、めまいなどがあれば、保護者・養護教諭・医療専門職に相談してね。</p></div>`}
function render(){document.querySelector('#root').innerHTML=`<header class="top"><div class="brand">mimi <small>♡</small></div><span class="topright">わたしの健康ノート ✿</span></header>`+({home,food,nutrition,calendar,profile,activity,sleep,mood}[screen]||home)();nav();}
function showModal(html){document.querySelector('#modalhost').innerHTML=`<div class="modalBackdrop"><div class="modal" role="dialog" aria-modal="true"><div class="row between"><strong>mimi ♡</strong><button class="ghost" id="closeModal" aria-label="閉じる">✕</button></div><div class="divider"></div>${html}</div></div>`;document.querySelector('#closeModal').onclick=closeModal;document.querySelector('.modalBackdrop').addEventListener('click',e=>{if(e.target.classList.contains('modalBackdrop'))closeModal()})}function closeModal(){pendingPhoto=null;editId=null;document.querySelector('#modalhost').innerHTML=''}
function startEdit(type,id){editId=id||null;pendingPhoto=null;const e=id?state.entries.find(x=>x.id===id):null;const titles={meal:'食事',activity:'運動・活動',sleep:'睡眠',mood:'体調・気分'},types={meal:['朝ごはん','昼ごはん','夜ごはん','おやつ'],activity:['お散歩','通学','部活動','ダンス','ストレッチ','ゆっくり休んだ'],mood:['元気','ふつう','疲れた','少しつらい']};let body=`<h2>${titles[type]}を${e?'編集':'記録'} ♡</h2><form id="recordform"><div class="field"><label>日付</label><input type="date" name="date" required value="${e?e.date:date}"></div>`;
if(type==='meal'){body+=`<div class="field"><label>食事の種類</label><select name="title">${types.meal.map(x=>`<option ${e?.title===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>食べたもの</label><textarea name="details" placeholder="例：はちみつ食パン、りんご、オートミール">${h(e?.details||'')}</textarea></div><div class="field"><label>写真（任意）</label><input id="photoFile" type="file" accept="image/*"><div id="imagePreview">${e?.photo?`<img class="picturePreview" src="${e.photo}" alt="登録写真"><button type="button" class="ghost" id="removePhoto">写真を削除</button>`:''}</div></div>`}
if(type==='activity')body+=`<div class="field"><label>何をした？</label><select name="title">${types.activity.map(x=>`<option ${e?.title===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>活動時間（任意・分）</label><input type="number" min="0" max="1440" name="minutes" placeholder="例：20" value="${attr(e?.minutes||'')}"></div>`;
if(type==='sleep')body+=`<div class="formgrid"><div class="field"><label>寝た時間</label><input type="time" name="bed" value="${attr(e?.bed||'23:00')}"></div><div class="field"><label>起きた時間</label><input type="time" name="wake" value="${attr(e?.wake||'07:00')}"></div></div><div class="field"><label>眠りの満足度</label><select name="quality">${['よく眠れた','ふつう','あまり眠れなかった'].map(x=>`<option ${e?.quality===x?'selected':''}>${x}</option>`).join('')}</select></div>`;
if(type==='mood')body+=`<div class="field"><label>今日の気分</label><select name="title">${types.mood.map(x=>`<option ${e?.title===x?'selected':''}>${x}</option>`).join('')}</select></div>`;
body+=`<div class="field"><label>メモ（任意）</label><textarea name="note" placeholder="自由に書いてね">${h(e?.note||'')}</textarea></div><div class="row between wrap"><button type="submit" class="primary">${e?'変更を保存':'記録を保存'} ♡</button>${e?'<button type="button" class="danger" id="deleteEntry">この記録を削除</button>':''}</div></form>`;showModal(body);
if(type==='meal'){document.querySelector('#photoFile').onchange=async ev=>{const file=ev.target.files[0];if(!file)return;if(file.size>15e6){notify('15MB以下の写真を選んでね');return}try{pendingPhoto=await compressImage(file);document.querySelector('#imagePreview').innerHTML=`<img class="picturePreview" src="${pendingPhoto}" alt="写真プレビュー"><button type="button" class="ghost" id="removePhoto">写真を削除</button>`;hookRemove()}catch(err){notify('写真を読み込めなかったよ')}};hookRemove()}
function hookRemove(){let rm=document.querySelector('#removePhoto');if(rm)rm.onclick=()=>{pendingPhoto='REMOVE';document.querySelector('#imagePreview').innerHTML='';document.querySelector('#photoFile').value=''}}
document.querySelector('#recordform').onsubmit=ev=>{ev.preventDefault();let fd=new FormData(ev.currentTarget),data={id:e?.id||uid(),type,date:String(fd.get('date')),title:type==='sleep'?'睡眠':String(fd.get('title')||''),note:String(fd.get('note')||'').slice(0,2000),created:e?.created||new Date().toISOString()};if(type==='meal'){data.details=String(fd.get('details')||'').slice(0,1000);data.photo=pendingPhoto==='REMOVE'?null:(pendingPhoto||e?.photo||null)}if(type==='activity'){data.minutes=String(fd.get('minutes')||'');data.details=data.minutes?data.minutes+'分':''}if(type==='sleep'){data.bed=String(fd.get('bed')||'');data.wake=String(fd.get('wake')||'');data.quality=String(fd.get('quality')||'');data.duration=duration(data.bed,data.wake);data.details=data.bed+'〜'+data.wake+'・'+data.quality}if(type==='mood')data.details=data.title;state.entries=e?state.entries.map(x=>x.id===e.id?data:x):[data,...state.entries];date=data.date;persist();closeModal();render();notify('記録を保存したよ ♡')};const del=document.querySelector('#deleteEntry');if(del)del.onclick=()=>{if(confirm('この記録を削除する？')){state.entries=state.entries.filter(x=>x.id!==e.id);persist();closeModal();render();notify('記録を削除したよ')}}}
function duration(a,b){let p=a.split(':').map(Number),q=b.split(':').map(Number);if(p.length<2||q.length<2)return '';let diff=(q[0]*60+q[1])-(p[0]*60+p[1]);if(diff<=0)diff+=1440;return `${Math.floor(diff/60)}時間${diff%60?diff%60+'分':''}`}
async function compressImage(file){return new Promise((res,rej)=>{let img=new Image(),u=URL.createObjectURL(file);img.onload=()=>{let scale=Math.min(1,900/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*scale);c.height=Math.round(img.height*scale);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);res(c.toDataURL('image/jpeg',.7))};img.onerror=()=>{URL.revokeObjectURL(u);rej()};img.src=u})}
function openFood(name){let f=foods.find(x=>x.name===name);if(!f)return;let allergy=state.profile.allergies||'';showModal(`<h2>${f.emoji} ${f.name}</h2><p>${f.desc}</p><h3>含まれる主な栄養素</h3><div class="chips">${f.tags.map(t=>`<span class="chip">${nutrients[t]?.label||t}</span>`).join('')}</div><p class="notice section">食品の種類・調理法・分量によって栄養素の量は異なるよ。病気やアレルギーがある場合は食品表示を確認してね。</p>${allergy?`<div class="tip">登録したアレルギー・苦手な食品：${h(allergy)}。この食品が安全かは自動判定していないので注意してね。</div>`:''}`)}
function saveProfile(){let ids=['name','age','height','weight','activity','allergies'],out={...state.profile};ids.forEach(k=>{let v=document.getElementById('p'+k);if(v)out[k]=String(v.value).trim()});let a=Number(out.age);if(out.age&&(a<0||a>120)){notify('年齢を確認してね');return}state.profile=out;persist();render();notify('プロフィールを保存したよ ♡')}
function doBackup(){let blob=new Blob([JSON.stringify({app:'mimi',version:1,saved:new Date().toISOString(),data:state},null,2)],{type:'application/json'}),a=document.createElement('a'),u=URL.createObjectURL(blob);a.href=u;a.download='mimi-backup-'+today()+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),5000);notify('バックアップを作ったよ')}
async function restore(file){if(!file)return;try{if(file.size>20e6)throw Error('ファイルが大きすぎるよ');let x=JSON.parse(await file.text());if(x.app!=='mimi'||!x.data||!Array.isArray(x.data.entries)||!x.data.profile)throw Error('mimiのバックアップではないみたい');if(!confirm('現在の記録をバックアップの内容で置き換えるよ。よろしい？'))return;state=x.data;persist();goto('home');notify('復元したよ ♡')}catch(e){notify('復元できなかったよ：'+e.message)}}
document.addEventListener('click',e=>{let n=e.target.closest('[data-nav]');if(n){goto(n.dataset.nav);return}let o=e.target.closest('[data-open]');if(o){startEdit(o.dataset.open);return}let sh=e.target.closest('[data-shift]');if(sh){let d=new Date(date+'T12:00:00');d.setDate(d.getDate()+Number(sh.dataset.shift));date=d.toLocaleDateString('sv-SE');render();return}let ed=e.target.closest('[data-edit]');if(ed){let ent=state.entries.find(x=>x.id===ed.dataset.edit);if(ent)startEdit(ent.type,ent.id);return}let nu=e.target.closest('[data-nutrient]');if(nu){nutrient=nu.dataset.nutrient;render();return}let fn=e.target.closest('[data-foodname]');if(fn){openFood(fn.dataset.foodname);return}let day=e.target.closest('[data-day]');if(day){date=day.dataset.day;render();return}let mn=e.target.closest('[data-month]');if(mn){let d=new Date(month+'-01T12:00:00');d.setMonth(d.getMonth()+Number(mn.dataset.month));month=d.toLocaleDateString('sv-SE').slice(0,7);render();return}if(e.target.closest('#saveprofile'))saveProfile();if(e.target.closest('#backup'))doBackup();if(e.target.closest('#restoreBtn'))document.querySelector('#restoreFile').click();if(e.target.closest('#wipe')){if(confirm('すべての記録とプロフィールを完全に削除する？この操作は元に戻せないよ。')){localStorage.removeItem(KEY);state={profile:{age:'',height:'',weight:'',activity:'normal',allergies:''},entries:[],onboarded:false};goto('home');notify('すべて削除したよ')}}});document.addEventListener('input',e=>{if(e.target.id==='foodsearch'){foodSearch=e.target.value;let start=e.target.selectionStart;render();let el=document.querySelector('#foodsearch');el.focus();el.setSelectionRange(start,start)}});document.addEventListener('change',e=>{if(e.target.id==='restoreFile')restore(e.target.files[0])});load();render();if('serviceWorker' in navigator && location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
